function b64(s){var b=atob(s),a=new Uint8Array(b.length);
 for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function unlock(pw){
 var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),
   "PBKDF2",false,["deriveKey"]);
 var key=await crypto.subtle.deriveKey(
   {name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},km,
   {name:"AES-GCM",length:256},false,["decrypt"]);
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(PAYLOAD));
 var ds=new DecompressionStream("gzip");
 var st=new Blob([pt]).stream().pipeThrough(ds);
 var html=await new Response(st).text();
 document.open();document.write(html);document.close();
}
var KEY="radar_pw:"+location.pathname;
var CK="radar_pw_"+(function(p){var h=5381;for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))>>>0;return h.toString(36)})(location.pathname);
var DIR=location.pathname.replace(/[^/]*$/,"");
function saveSecret(pw){
 try{localStorage.setItem(KEY,pw)}catch(_){}
 try{document.cookie=CK+"="+encodeURIComponent(pw)+";max-age=31536000;path="+DIR+";SameSite=Lax;Secure"}catch(_){}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
}
function loadSecret(){
 try{var s=localStorage.getItem(KEY);if(s)return s}catch(_){}
 try{var m=document.cookie.match(new RegExp("(?:^|; )"+CK+"=([^;]*)"));
   if(m)return decodeURIComponent(m[1])}catch(_){}
 return null;
}
async function go(auto){
 var pw=document.getElementById("pw").value;
 if(!pw)return;
 var btn=document.getElementById("go");btn.disabled=true;
 document.getElementById("err").textContent="";
 try{
   if(!auto&&document.getElementById("rm")&&document.getElementById("rm").checked)
     saveSecret(pw); // до расшифровки: после document.write этот скрипт уже мёртв
   await unlock(pw);
 }catch(e){
   try{localStorage.removeItem(KEY);
     document.cookie=CK+"=;max-age=0;path="+DIR}catch(_){}
   btn.disabled=false;
   document.getElementById("form").style.display="";
   document.getElementById("auto").style.display="none";
   document.getElementById("err").textContent="Пароль не подошёл. Попробуй ещё раз.";
 }
}
document.getElementById("go").onclick=function(){go(false)};
document.getElementById("pw").addEventListener("keydown",function(e){
 if(e.key==="Enter")go(false)});
(function(){
 var s=loadSecret();
 if(s){
   document.getElementById("form").style.display="none";
   document.getElementById("auto").style.display="";
   document.getElementById("pw").value=s;
   go(true);
 }
})();
